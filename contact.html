<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — genesoup</title>
<meta name="description" content="Tell us what you’re building. hello@genesoup.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --dim:#9a9a9a; --sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; }
  * { box-sizing:border-box; margin:0; }
  html { scroll-behavior:smooth; }
  @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  html,body { overflow-x:hidden; background:#000; color:#fff; font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:#fff; text-decoration:none; }
  :focus-visible { outline:2px solid #fff; outline-offset:3px; }
  .cta { align-self:flex-start; display:inline-flex; align-items:center; border:2px solid #fff; border-radius:40px; padding:14px 24px; min-height:54px; font-size:18px; font-weight:600; letter-spacing:-.01em; background:#000; color:#fff; transition:background .2s,color .2s; }
  .cta:hover { background:#fff; color:#000; }
  .contact { position:relative; min-height:100vh; min-height:100svh; padding:88px clamp(20px,3.5vw,48px) 40px; display:flex; flex-direction:column; background:transparent; z-index:1; }
  .contact-body { flex:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,592px); gap:56px 48px; align-items:end; padding:64px 0 0 4px; }
  .contact .display { font-weight:700; font-size:clamp(64px,8.9vw,128px); line-height:.86; letter-spacing:-.055em; }
  .contact .lead { margin-top:24px; max-width:560px; font-size:clamp(22px,2.3vw,32px); line-height:1.2; letter-spacing:-.02em; font-weight:500; color:#d0d0d0; }
  .contact .mail { display:inline-block; margin-top:20px; font-size:clamp(16px,1.4vw,20px); line-height:1.3; letter-spacing:-.01em; font-weight:500; text-decoration:underline; text-underline-offset:4px; }
  form { display:flex; flex-direction:column; gap:20px; }
  .field { display:flex; flex-direction:column; gap:8px; }
  .field label { font:400 13px var(--mono); color:var(--dim); text-shadow:0 0 6px #000,0 0 10px #000; }
  .field input, .field textarea { width:100%; background:#000; color:#fff; border:2px solid #333; border-radius:16px; padding:0 20px; height:54px; font:400 16px var(--sans); transition:border-color .2s; }
  .field textarea { height:140px; padding:16px 20px; resize:vertical; min-height:140px; }
  .field input::placeholder, .field textarea::placeholder { color:var(--dim); }
  .field input:focus, .field textarea:focus { border-color:#fff; outline:none; }
  .field[data-invalid="true"] input, .field[data-invalid="true"] textarea { border-color:#fff; border-style:dashed; }
  .field .err { font:400 13px var(--mono); color:#fff; min-height:0; }
  .field .err:empty { display:none; }
  .actions { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  button.cta { font-family:inherit; cursor:pointer; }
  .status { font:400 13px var(--mono); color:var(--dim); }
  @media (max-width:860px) { .contact { padding-top:85px; padding-bottom:35px; } .contact-body { grid-template-columns:1fr; align-items:start; align-content:start; padding-top:0; row-gap:40px; } .contact .lead { margin-top:20px; } }

  @media (max-width:600px) {
    .contact .display { font-size:44px; }
    .contact .lead { font-size:17px; }
    .contact .mail { font-size:14px; }
    .cta { font-size:15px; padding:12px 20px; min-height:48px; }
  }

  /* ---------- sticky header + flows ---------- */
  html { scroll-padding-top:0; }
  .site-header { position:fixed; top:0; left:0; right:0; z-index:20; height:64px; padding:0 clamp(20px,3.5vw,48px); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; background:#000; border-bottom:1px solid transparent; transition:border-color .2s; font-size:14px; }
  .site-header.scrolled { border-bottom-color:#222; }
  .brand, .navlink { display:inline-flex; align-items:center; min-height:44px; }
  .brand { justify-self:start; font-weight:700; letter-spacing:-.01em; }
  .tagline { color:var(--dim); }
  nav { justify-self:end; }
  .navlink { color:#fff; }
  .navlink:hover, .brand:hover { color:var(--dim); }
  .navlink[aria-current="true"] { text-decoration:underline; text-underline-offset:4px; }
  @media (max-width:860px) { .site-header { grid-template-columns:1fr auto; } .tagline { display:none; } }
  .field input:focus-visible, .field textarea:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .sound { min-height:44px; }
  .actions .copy { background:none; border:0; color:#fff; font:500 13px var(--mono); text-decoration:underline; text-underline-offset:3px; cursor:pointer; min-height:44px; padding:0 4px; }

  .contact { z-index:1; }
</style>
</head>
<body>
<header class="site-header" id="siteHeader">
  <a class="brand" href="index.html" id="brand" aria-label="genesoup — back to top"><b>genesoup™</b></a>
  <span class="tagline">lifescience &amp; product design</span>
  <nav aria-label="Main"><a class="navlink" href="contact.html" id="navContact" aria-current="true">Contact</a></nav>
</header>
<main>
<section class="contact" id="contact" aria-labelledby="contact-title">
  <div class="contact-body">
    <div>
      <h2 class="display" id="contact-title">Hello.</h2>
      <p class="lead">Tell us what you’re building.</p>
      <a class="mail" href="mailto:hello@genesoup.com">hello@genesoup.com</a>
    </div>
    <form id="contactForm" novalidate>
      <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" type="text" autocomplete="name" placeholder="Your name" required><div class="err" id="e-name" aria-live="polite"></div></div>
      <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required><div class="err" id="e-email" aria-live="polite"></div></div>
      <div class="field"><label for="f-msg">Message</label><textarea id="f-msg" name="message" placeholder="What are you working on?" required></textarea><div class="err" id="e-msg" aria-live="polite"></div></div>
      <div class="actions"><button class="cta" type="submit">Send message</button><span class="status" id="formStatus" role="status" aria-live="polite"></span><button class="copy" id="copyMail" type="button" hidden>Copy email address</button></div>
    </form>
  </div>
</section>
</main>
<script>
(() => {
  "use strict";
  /* ---------- contact form ---------- */
  (() => {
    const form = document.getElementById("contactForm");
    const status = document.getElementById("formStatus");
    const rules = {
      name:    { el: "f-name",  err: "e-name",  msg: "Add your name so we know who to reply to.", ok: v => v.trim().length > 0 },
      email:   { el: "f-email", err: "e-email", msg: "Add an email address like you@company.com so we can reply.", ok: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) },
      message: { el: "f-msg",   err: "e-msg",   msg: "Add a few words about what you’re working on.", ok: v => v.trim().length > 0 }
    };
    function check(k, show) {
      const r = rules[k], el = document.getElementById(r.el), good = r.ok(el.value);
      const wrap = el.closest(".field");
      if (show) { wrap.dataset.invalid = String(!good); good ? el.removeAttribute("aria-invalid") : el.setAttribute("aria-invalid", "true"); document.getElementById(r.err).textContent = good ? "" : r.msg; }
      return good;
    }
    for (const k in rules) {
      const el = document.getElementById(rules[k].el);
      el.addEventListener("blur", () => check(k, true));
      el.addEventListener("input", () => { if (el.closest(".field").dataset.invalid === "true") { el.closest(".field").dataset.invalid = "false"; el.removeAttribute("aria-invalid"); document.getElementById(rules[k].err).textContent = ""; } });
    }
    form.addEventListener("submit", e => {
      e.preventDefault();
      let first = null;
      for (const k in rules) if (!check(k, true) && !first) first = document.getElementById(rules[k].el);
      if (first) { first.focus(); status.textContent = ""; return; }
      const d = new FormData(form);
      const subject = encodeURIComponent("Hello from " + d.get("name"));
      const body = encodeURIComponent(d.get("message") + "\n\n— " + d.get("name") + " (" + d.get("email") + ")");
      status.textContent = "Opening your email app. Nothing opened? Copy the address and write to us.";
      document.getElementById("copyMail").hidden = false;
      window.location.href = "mailto:hello@genesoup.com?subject=" + subject + "&body=" + body;
    });
  })();

  document.getElementById("copyMail").addEventListener("click", async e => {
    const btn = e.currentTarget, st = document.getElementById("formStatus");
    try { await navigator.clipboard.writeText("hello@genesoup.com"); st.textContent = "Address copied: hello@genesoup.com"; }
    catch { st.textContent = "Couldn’t copy automatically. The address is hello@genesoup.com."; }
    btn.blur();
  });
  const header = document.getElementById("siteHeader");
  const onScroll = () => header.classList.toggle("scrolled", window.scrollY > 8);
  onScroll(); window.addEventListener("scroll", onScroll, { passive: true });
})();
</script>
</body>
</html>
