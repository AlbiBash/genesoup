<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>genesoup — lifescience &amp; product design</title>
<meta name="description" content="Shhhhh... We build things in stealth for you. Those who know, know.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --dim:#9a9a9a; --sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; }
  * { box-sizing:border-box; margin:0; }
  html { scroll-behavior:smooth; }
  @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  html,body { overflow-x:hidden; background:#000; color:#fff; font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:#fff; text-decoration:none; }
  :focus-visible { outline:2px solid #fff; outline-offset:3px; }
  .hero { touch-action:none; position:relative; z-index:1; height:100vh; height:100svh; overflow:hidden; }
  #strings { position:fixed; inset:0; z-index:0; width:100%; height:100%; display:block; pointer-events:none; }
  .page { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; padding:88px clamp(20px,3.5vw,48px) 40px; pointer-events:none; }
  .page a, .page button { pointer-events:auto; }
  .body { flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:24px; padding-left:4px; }
  h1 { font-weight:700; font-size:clamp(64px,8.9vw,128px); line-height:.86; letter-spacing:-.055em; }
  .msg { max-width:560px; font-size:clamp(22px,2.3vw,32px); line-height:1.2; letter-spacing:-.02em; font-weight:500; color:#d0d0d0; }
  .msg .d { display:none; }
  @media (min-width:861px) { .msg .d { display:inline; } }
  .cta { align-self:flex-start; display:inline-flex; align-items:center; border:2px solid #fff; border-radius:40px; padding:14px 24px; min-height:54px; font-size:18px; font-weight:600; letter-spacing:-.01em; background:#000; color:#fff; transition:background .2s,color .2s; }
  .cta:hover { background:#fff; color:#000; }
  main:focus { outline:none; }
  .hint { position:absolute; z-index:3; right:clamp(20px,3.5vw,48px); bottom:40px; display:flex; align-items:center; gap:12px; font:400 13px var(--mono); color:var(--dim); }
  .sound { display:inline-flex; align-items:center; gap:8px; cursor:pointer; padding:9px 14px; border-radius:40px; border:2px solid #fff; background:#000; color:#fff; font:500 13px var(--mono); white-space:nowrap; }
  .sound .bars { display:inline-flex; gap:2px; align-items:flex-end; height:12px; }
  .sound .bars i { width:2px; background:currentColor; }
  .sound .bars i:nth-child(1){height:5px} .sound .bars i:nth-child(2){height:12px} .sound .bars i:nth-child(3){height:8px}
  .sound[aria-pressed="false"] { border-color:#333; color:var(--dim); } .sound[aria-pressed="false"] .bars i { height:2px; }
  .hint-text { transition:opacity .6s; } .hint-text.gone { opacity:0; }
  @media (max-width:860px) { .hint { left:20px; right:20px; bottom:auto; top:auto; justify-content:space-between; bottom:calc(100svh - 100svh + 12px); } .body { padding-bottom:56px; } }

  @media (max-width:600px) {
    h1 { font-size:44px; }
    .msg { font-size:17px; }
    .cta { font-size:15px; padding:12px 20px; min-height:48px; }
    .sound { font-size:12px; }
  }

  /* ---------- sticky header + flows ---------- */
  html { scroll-padding-top:0; }
  .site-header { position:fixed; top:0; left:0; right:0; z-index:20; height:64px; padding:0 clamp(20px,3.5vw,48px); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; background:#000; border-bottom:1px solid transparent; transition:border-color .2s; font-size:14px; }
  .site-header.scrolled { border-bottom-color:#222; }
  .brand, .navlink { display:inline-flex; align-items:center; min-height:44px; }
  .brand { justify-self:start; font-weight:700; letter-spacing:-.01em; }
  .tagline { color:var(--dim); }
  nav { justify-self:end; }
  .navlink { color:#fff; }
  .navlink:hover, .brand:hover { color:var(--dim); }
  .navlink[aria-current="true"] { text-decoration:underline; text-underline-offset:4px; }
  @media (max-width:860px) { .site-header { grid-template-columns:1fr auto; } .tagline { display:none; } }
  .field input:focus-visible, .field textarea:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .sound { min-height:44px; }
  .actions .copy { background:none; border:0; color:#fff; font:500 13px var(--mono); text-decoration:underline; text-underline-offset:3px; cursor:pointer; min-height:44px; padding:0 4px; }

  /* ---------- enter screen ---------- */
  body.locked { overflow:hidden; }
  .enter { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:#000; transition:opacity .6s ease, visibility 0s linear .6s; }
  .enter.leaving { opacity:0; visibility:hidden; }
  .enter-btn { background:none; border:0; border-radius:0; color:#fff; font:600 18px var(--sans); letter-spacing:-.01em; padding:10px 4px; min-height:44px; cursor:pointer; transition:color .2s,border-color .2s; }
  .enter-btn { text-decoration:underline; text-decoration-color:transparent; text-decoration-thickness:2px; text-underline-offset:3px; }
  .enter-btn:focus-visible { outline:none; }
  .enter-btn:hover, .enter-btn:focus-visible { text-decoration-color:#fff; }
  @media (prefers-reduced-motion:reduce) { .enter { transition:none; } }
</style>
</head>
<body>
<div class="enter" id="enter" role="dialog" aria-modal="true" aria-label="Enter genesoup">
  <button class="enter-btn" id="enterBtn" type="button">Enter</button>
</div>
<header class="site-header" id="siteHeader">
  <a class="brand" href="index.html" id="brand" aria-label="genesoup — back to top"><b>genesoup™</b></a>
  <span class="tagline">lifescience &amp; product design</span>
  <nav aria-label="Main"><a class="navlink" href="contact.html" id="navContact">Contact</a></nav>
</header>
<canvas id="strings" aria-hidden="true"></canvas>
<main class="hero" id="top" tabindex="-1">
  <div class="page">
    <div class="body">
      <h1>Shhhhh...</h1>
      <p class="msg">We build things in stealth for you,<br class="d"> so there’s not much to share here,<br class="d"> those who know, know.</p>
      <a class="cta" href="contact.html">Contact us</a>
    </div>
  </div>
  <div class="hint">
    <span class="hint-text" id="hint">Move your cursor across the strands</span>
    <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Sound on"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="soundLabel">Sound on</span></button>
  </div>
</main>




<script>
(() => {
  "use strict";

  /* ================= audio ================= */
  const Sound = (() => {
    let ctx = null, master = null, enabled = true;
    const PENT = [0, 2, 4, 7, 9];

    function impulse(c, seconds, decay) {
      const len = Math.floor(c.sampleRate * seconds);
      const buf = c.createBuffer(2, len, c.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      return buf;
    }

    function init() {
      if (ctx) return ctx.state === "suspended" ? ctx.resume().catch(() => {}) : null;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { enabled = false; return; }
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 6;
      master = ctx.createGain(); master.gain.value = 0.7;
      const dry = ctx.createGain(); dry.gain.value = 0.7;
      const wet = ctx.createGain(); wet.gain.value = 0.55;
      const verb = ctx.createConvolver(); verb.buffer = impulse(ctx, 3.2, 2.6);
      master.connect(dry); master.connect(verb); verb.connect(wet);
      dry.connect(comp); wet.connect(comp); comp.connect(ctx.destination);
      ctx.onstatechange = () => document.dispatchEvent(new Event("soundstate"));
      if (ctx.state === "suspended") return ctx.resume().catch(() => {});
    }

    /* index 0..count-1 → pentatonic note over ~3 octaves */
    function freqFor(index, count) {
      const steps = Math.min(count, 20);
      const k = count > 1 ? Math.round(index * (steps - 1) / (count - 1)) : 0;
      const midi = 60 + PENT[k % 5] + 12 * Math.floor(k / 5);
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function chime(index, count, velocity) {
      if (!enabled || !ctx || ctx.state !== "running") return;
      const f = freqFor(index, count);
      const t = ctx.currentTime;
      const v = Math.min(1, 0.18 + velocity);
      const partials = [[1, 1, 2.8], [2.76, 0.32, 1.5], [5.4, 0.14, 0.7], [8.93, 0.05, 0.35]];
      const out = ctx.createGain();
      out.gain.value = 0.32 * v;
      out.connect(master);
      for (const [ratio, amp, dur] of partials) {
        const fr = f * ratio;
        if (fr > 12000) continue;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = fr;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(amp, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(out);
        o.start(t); o.stop(t + dur + 0.05);
      }
      out.gain.setTargetAtTime(0, t + 3, 0.5);
      setTimeout(() => out.disconnect(), 4500);
    }

    return {
      init, chime,
      get enabled() { return enabled; },
      set enabled(v) { enabled = v; },
      get ready() { return !!ctx && ctx.state === "running"; }
    };
  })();

  /* ================= strings ================= */
  const canvas = document.getElementById("strings");
  const hero = document.getElementById("top");
  const g2 = canvas.getContext("2d");
  const BASES = "ATGC";
  const COLORS = { A: "#ffffff", T: "#cfcfcf", G: "#9a9a9a", C: "#6a6a6a" };
  const PAIR = { A: "T", T: "A", G: "C", C: "G" };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, dpr = 1;
  let strings = [];
  let rows = 0, rowGap = 24, fontPx = 15;

  class GString {
    constructor(x, n, index, count) {
      this.x = x; this.n = n; this.index = index; this.count = count;
      this.u = new Float32Array(n);   // displacement
      this.v = new Float32Array(n);   // velocity
      this.energy = 0;
      this.last = 0;
      this.letters = Array.from({ length: n }, () => BASES[(Math.random() * 4) | 0]);
      // second strand neighbour (complementary look) is implied by pairing colours
    }
    pluck(row, dir, amp) {
      const sigma = 4;
      for (let i = 1; i < this.n - 1; i++) {
        const d = (i - row) / sigma;
        const w = Math.exp(-d * d);
        if (w > 0.02) {
          this.v[i] += dir * amp * w;
          if (Math.random() < 0.22 * w) this.letters[i] = BASES[(Math.random() * 4) | 0];
        }
      }
    }
    step(c2, damp, nu) {
      const { u, v, n } = this;
      let e = 0;
      for (let i = 1; i < n - 1; i++) {
        const a = c2 * (u[i - 1] + u[i + 1] - 2 * u[i])
                + nu * (v[i - 1] + v[i + 1] - 2 * v[i]) - damp * v[i];
        v[i] += a;
      }
      for (let i = 1; i < n - 1; i++) { u[i] += v[i]; e += v[i] * v[i]; }
      this.energy = e;
    }
  }

  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);

    const spacing = W < 520 ? 13 : W < 900 ? 15 : 17;
    const count = Math.max(6, Math.floor((W - 40) / spacing));
    const left = (W - (count - 1) * spacing) / 2;
    rowGap = W < 520 ? 13 : 15;
    fontPx = W < 520 ? 8 : 10;
    rows = Math.floor((H - 20) / rowGap);
    const top = (H - (rows - 1) * rowGap) / 2;
    strings = Array.from({ length: count }, (_, i) => new GString(left + i * spacing, rows, i, count));
    strings.top = top;
  }

  /* pointer → crossing detection */
  let prev = null, prevT = 0;
  function onMove(clientX, clientY, t) {
    const r = { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
    const x = clientX - r.left, y = clientY - r.top;
    if (y < 0 || y > r.height || x < 0 || x > r.width) { prev = null; return; }
    if (prev) {
      const dx = x - prev.x;
      if (dx !== 0) {
        const dt = Math.max(1, t - prevT);
        const speed = Math.abs(dx) / dt;           // px per ms
        for (const s of strings) {
          if ((prev.x - s.x) * (x - s.x) <= 0 && !(prev.x === s.x && x === s.x)) {
            const k = (s.x - prev.x) / dx;
            const yy = prev.y + (y - prev.y) * k;
            const row = (yy - strings.top) / rowGap;
            if (row < 1 || row > rows - 2) continue;
            const amp = Math.min(2.2, 0.35 + speed * 0.9);
            s.pluck(row, Math.sign(dx), amp);
            if (t - s.last > 70 && t - lastAny > 25) {
              lastAny = t;
              s.last = t;
              Sound.chime(s.index, s.count, Math.min(1, speed * 0.7));
            }
            hideHint();
          }
        }
      }
    }
    prev = { x, y }; prevT = t;
  }

  let lastAny = 0;
  let hinted = false;
  function hideHint() {
    if (hinted) return; hinted = true;
    document.getElementById("hint").classList.add("gone");
  }

  // Sound is on by default. Browsers only start audio after a click, tap or key press, so we keep trying
  // on every interaction and it begins the moment the browser allows it (no prompt, no extra step).
  function unlockAudio() { if (!Sound.ready) { const p = Sound.init(); if (p && p.then) p.then(() => document.dispatchEvent(new Event("soundstate"))); } }
  window.addEventListener("pointermove", e => { unlockAudio(); onMove(e.clientX, e.clientY, e.timeStamp); }, { passive: true });
  window.addEventListener("pointerdown", e => { if (!e.target.closest("#sound")) unlockAudio(); prev = null; onMove(e.clientX, e.clientY, e.timeStamp); }, { passive: true });
  window.addEventListener("pointerup", () => { prev = null; }, { passive: true });
  hero.addEventListener("pointerleave", () => { prev = null; });
  window.addEventListener("keydown", e => { if (!e.target.closest("#sound")) unlockAudio(); });
  window.addEventListener("touchend", e => { if (!e.target.closest("#sound")) unlockAudio(); }, { passive: true });

  /* keyboard users: arrow keys strum across strings, enter/space on hero is not needed */
  const soundBtn = document.getElementById("sound");
  const soundLabel = document.getElementById("soundLabel");
  function syncSound() {
    const on = Sound.enabled;
    soundBtn.setAttribute("aria-pressed", String(on));
    soundBtn.setAttribute("aria-label", on ? "Sound on" : "Sound off");
    soundLabel.textContent = on ? "Sound on" : "Sound off";
  }
  soundBtn.addEventListener("click", () => {
    unlockAudio();                    // this click is a user gesture, so the browser lets audio start
    Sound.enabled = !Sound.enabled;
    syncSound();
  });

  /* ---------- enter screen: one click gives the browser the gesture it needs to play sound ---------- */
  (() => {
    const overlay = document.getElementById("enter"), btn = document.getElementById("enterBtn");
    const behind = [...document.querySelectorAll(".site-header, main")];
    behind.forEach(el => { el.inert = true; });
    document.body.classList.add("locked");
    btn.focus({ preventScroll: true });
    function enter(withSound) {
      Sound.enabled = withSound; syncSound();
      if (withSound) { const p = Sound.init(); (p && p.then ? p : Promise.resolve()).then(() => Sound.chime(9, 20, 0.5)); }
      behind.forEach(el => { el.inert = false; });
      document.body.classList.remove("locked");
      overlay.classList.add("leaving");
      setTimeout(() => { overlay.hidden = true; }, 700);
      document.getElementById("top").focus({ preventScroll: true });
    }
    btn.addEventListener("click", () => enter(true));
  })();

  /* ---------- simulation + render ---------- */
  const STEP = 1000 / 60, SUB = 10, C2 = 0.5, DAMP = 0.0014, NU = 0.06;
  let acc = 0, lastT = performance.now(), visible = true;

  document.addEventListener("visibilitychange", () => { visible = !document.hidden; });

  function frame(now) {
    requestAnimationFrame(frame);
    if (!visible) { lastT = now; return; }
    acc += Math.min(100, now - lastT); lastT = now;
    while (acc >= STEP) {
      for (let k = 0; k < SUB; k++) for (const s of strings) s.step(C2, DAMP, NU);
      acc -= STEP;
    }
    draw();
  }

  function draw() {
    g2.clearRect(0, 0, W, H);
    g2.font = `600 ${fontPx}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
    g2.textAlign = "center"; g2.textBaseline = "middle";
    const top = strings.top;
    for (const s of strings) {
      const live = Math.min(1, Math.sqrt(s.energy) * 0.35);
      // faint string line
      g2.beginPath();
      for (let i = 0; i < s.n; i++) {
        const x = s.x + s.u[i], y = top + i * rowGap;
        i ? g2.lineTo(x, y) : g2.moveTo(x, y);
      }
      g2.strokeStyle = `rgba(255,255,255,${0.07 + live * 0.35})`;
      g2.lineWidth = 1;
      g2.stroke();

      for (let i = 0; i < s.n; i++) {
        const u = s.u[i];
        const x = s.x + u, y = top + i * rowGap;
        const edge = Math.min(i, s.n - 1 - i) / 6;        // fade towards pinned ends
        const local = Math.min(1, Math.abs(u) / 6);
        const a = Math.min(1, edge) * Math.min(1, 0.2 + local * 0.8);
        const L = s.letters[i];
        g2.globalAlpha = a;
        g2.fillStyle = COLORS[L];
        g2.fillText(L, x, y);
      }
    }
    g2.globalAlpha = 1;
  }

  let rz;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(build, 120); });

  const start = () => { build(); requestAnimationFrame(frame); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);

  /* ---------- header ---------- */
  (() => {
    const header = document.getElementById("siteHeader");
    const onScroll = () => header.classList.toggle("scrolled", window.scrollY > 8);
    onScroll(); window.addEventListener("scroll", onScroll, { passive: true });
  })();
})();
</script>
</body>
</html>
